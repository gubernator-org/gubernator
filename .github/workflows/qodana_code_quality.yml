name: Go Code Quality & Security

on:
  push:
    branches:
      - main
      - 'releases/*'
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  code-quality:
    name: Go Static Analysis, Vulnerability Scan & pkg.go.dev Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify gofmt -s (Go Report Card Formatting)
        run: |
          UNFORMATTED=$(gofmt -s -l cmd/ internal/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted with gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ All Go files pass gofmt -s"

      - name: Run go vet (Static Analysis)
        run: go vet ./...

      - name: Run ineffassign (Go Report Card Ineffectual Assignments)
        run: go run github.com/gordonklaus/ineffassign@latest ./...

      - name: Run govulncheck (Official Go Vulnerability Database / pkg.go.dev)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source ./... || true

      - name: Sync Index with pkg.go.dev & Go Report Card
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sS -X POST "https://pkg.go.dev/fetch/github.com/gubernator-org/gubernator@main" || true
          curl -sS -X POST "https://goreportcard.com/checks" -d "repo=github.com/gubernator-org/gubernator" || true